<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>上揚森活付款試算</title>
<meta name="theme-color" content="#2f7d4a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="上揚森活">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>html{-webkit-text-size-adjust:100%}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap">
<style>
/* Layout: inputs on the left, payment schedule + loan comparison on the right; stacks on phone */
:root{
  --bg:#f1f7f0; --surface:#ffffff; --line:#d3e4d1; --fg:#1c2b1f; --muted:#5b6f5e;
  --accent:#2f7d4a; --accent-soft:#e0f0e0; --warn:#a0521a; --warn-soft:#fbeee2; --ok:#2c7a4b;
  --display:"Noto Serif TC","Songti TC",serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111813; --surface:#18221b; --line:#2a3a2e; --fg:#e2ece3; --muted:#98ab9b;
  --accent:#7cc993; --accent-soft:#1c3323; --warn:#e9a46b; --warn-soft:#3a2a1c; --ok:#6cc495; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111813; --surface:#18221b; --line:#2a3a2e; --fg:#e2ece3; --muted:#98ab9b;
  --accent:#7cc993; --accent-soft:#1c3323; --warn:#e9a46b; --warn-soft:#3a2a1c; --ok:#6cc495; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.55}
.wrap{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:24px 48px}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 24px;margin-bottom:20px}
h1{font-family:var(--display);font-size:1.75rem;margin:0;text-wrap:balance}
header p{margin:0;color:var(--muted);font-size:.875rem}
.grid{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:860px){.grid{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px}
.stack{display:flex;flex-direction:column;gap:20px}
h2{font-size:.8rem;letter-spacing:.08em;color:var(--muted);margin:0 0 12px;font-weight:700}
label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:4px}
.field{display:flex;flex-direction:column}
.fields{display:flex;flex-direction:column;gap:12px}
.inp{display:flex;align-items:center;border:1px solid var(--line);border-radius:6px;background:var(--bg);overflow:hidden}
.inp:focus-within{outline:2px solid var(--accent);outline-offset:1px}
.inp input,.inp select{flex:1;min-width:0;border:0;background:transparent;color:var(--fg);font:inherit;padding:8px 10px;font-variant-numeric:tabular-nums}
.inp input:focus,.inp select:focus{outline:none}
.inp span{padding:0 10px;color:var(--muted);font-size:.85rem;white-space:nowrap}
.big input{font-size:1.5rem;font-weight:700}
.pricerow{display:flex;flex-direction:column;gap:12px}
.pricerow .big input{font-size:2rem;padding:12px 14px}
.pricerow .big span{font-size:1rem}
.pricerow .rate{max-width:150px}
.pricerow .rate label{font-size:.8rem}
.pricerow .rate .inp input{padding:5px 8px;font-size:.9rem}
.hint{font-size:.78rem;color:var(--muted);margin-top:4px}
.rules{margin:0;padding-left:1.3em;font-size:.88rem;display:flex;flex-direction:column;gap:4px}
.rules b{font-weight:700}
.status{margin-top:4px;font-size:.85rem;padding:8px 10px;border-radius:6px;background:var(--warn-soft);color:var(--warn)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.kpi .k{font-size:.8rem;color:var(--muted)}
.kpi .v{font-size:1.45rem;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi .s{font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}
.kpi.main{background:var(--accent-soft);border-color:transparent}
.kpi.main .v{color:var(--accent)}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.92rem;font-variant-numeric:tabular-nums}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{font-size:.78rem;color:var(--muted);font-weight:500}
th:first-child,td:first-child{text-align:left}
td.n{color:var(--muted);width:32px}
td.merged{vertical-align:middle;border-left:1px solid var(--line);border-right:1px solid var(--line)}
td.rule{color:var(--muted);font-size:.8rem}
tr.loan td{color:var(--accent);font-weight:500}
tr.tot td{font-weight:700;border-bottom:0;border-top:2px solid var(--fg)}
.ylopts{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:12px}
.ylopts .field{flex:1 1 140px;max-width:220px}
.cmp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:560px){.cmp{grid-template-columns:minmax(0,1fr)}}
.term{border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.term .yr{font-family:var(--display);font-size:1.1rem;font-weight:700}
.term .pay{font-size:1.9rem;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1.2}
.term .pay small{font-size:.9rem;color:var(--muted);font-weight:500}
.term dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0;font-size:.85rem;font-variant-numeric:tabular-nums}
.term dt{color:var(--muted)}
.term dd{margin:0;text-align:right}
.note{font-size:.8rem;color:var(--muted);margin:12px 0 0}
.copyrow{display:flex;justify-content:flex-end;margin-top:12px}
button.b{border:1px solid var(--line);background:var(--bg);color:var(--fg);font:inherit;font-size:.85rem;padding:6px 12px;border-radius:6px;cursor:pointer}
button.b:hover,button.b:focus-visible{border-color:var(--accent);color:var(--accent);outline:none}
</style>
</head>
<body>


<div class="wrap">
  <header>
    <h1>上揚森活付款試算</h1>
    <p>輸入總價，自動算出各期款與交屋後房貸月付</p>
  </header>

  <div class="grid">
    <div class="stack">
      <section class="panel">
        <div class="pricerow">
          <div class="field grow"><label for="price">房屋總價</label><div class="inp big"><input id="price" type="number" inputmode="numeric" min="0" step="1" value="1288"><span>萬元</span></div></div>
          <div class="field rate"><label for="rate">房貸年利率</label><div class="inp"><input id="rate" type="number" step="0.01" min="0" value="2.5"><span>%</span></div></div>
        </div>
        <div class="hint" id="priceHint"></div>
        <div class="status" id="status" hidden></div>
      </section>
    </div>

    <div class="stack">
      <section class="panel">
        <div class="kpis">
          <div class="kpi"><div class="k">自備款</div><div class="v" id="kOwn">—</div><div class="s" id="kOwnP"></div></div>
          <div class="kpi"><div class="k">交屋款</div><div class="v" id="kHand">—</div><div class="s" id="kHandP"></div></div>
          <div class="kpi"><div class="k">銀行貸款</div><div class="v" id="kLoan">—</div><div class="s" id="kLoanP"></div></div>
          <div class="kpi main"><div class="k">每月房貸（30 年／40 年）</div><div class="v" id="kMonth">—</div><div class="s" id="kMonthS"></div></div>
          <div class="kpi main"><div class="k">新青安前 3 年月付（30 年／40 年）</div><div class="v" id="kYouth">—</div><div class="s" id="kYouthS"></div></div>
        </div>
      </section>

      <section class="panel">
        <h2>付款辦法</h2>
        <div class="tablewrap">
          <table>
            <thead><tr><th>期別</th><th>比例</th><th>金額（萬元）</th></tr></thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
        <div class="copyrow"><button class="b" id="copyBtn" type="button">複製付款明細</button></div>
      </section>

      <section class="panel">
        <h2>交屋後房貸月付（貸款＋交屋款，本息平均攤還）</h2>
        <div class="cmp" id="cmp"></div>
        <p class="note">月付金四捨五入至元，實際以銀行核貸條件為準。本試算僅供參考，金額以買賣契約為準。</p>
      </section>

      <section class="panel">
        <h2>新青安 3.0 月付（一段式機動利率，本息平均攤還）</h2>
        <div class="ylopts">
          <div class="field"><label for="yCap">新青安額度上限</label><div class="inp"><select id="yCap"><option value="1000">一般 1,000 萬</option><option value="1200">新婚 1,200 萬</option><option value="1500">育兒 1,500 萬</option></select></div></div>
        </div>
        <div class="status" id="yNote" hidden></div>
        <div class="tablewrap">
          <table>
            <thead><tr><th>期間</th><th>利率</th><th>30 年月付（元）</th><th>40 年月付（元）</th></tr></thead>
            <tbody id="ybody"></tbody>
          </table>
        </div>
        <p class="note">利率調整時，以當時剩餘本金與剩餘期數重新計算月付。實際利率以承貸銀行核定為準。</p>
      </section>
    </div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
const fmt=n=>Math.round(n).toLocaleString('zh-TW');
const wan=n=>{const w=Math.round(n)/10000;return (Number.isInteger(w)?w:+w.toFixed(2))+' 萬'};
const pct=(a,p)=>p>0?Math.round(a/p*100)+'%':'—';

function pmt(P,ratePct,years){
  const r=ratePct/100/12,N=years*12;
  if(P<=0) return 0;
  return r===0?P/N:P*r/(1-Math.pow(1+r,-N));
}

const YS=[
  {label:'撥貸後前 3 年',from:1,to:36,r:1.775},
  {label:'第 4 年',from:37,to:48,r:1.9},
  {label:'第 5 年',from:49,to:60,r:2.025},
  {label:'第 6 年',from:61,to:72,r:2.15},
  {label:'第 7 年起（補貼歸零）',from:73,to:Infinity,r:2.275},
];
// 每段開始時以剩餘本金、剩餘期數重算月付，回傳各段月付
function youthPays(P,years){
  const N=years*12; let bal=P; const out=[];
  for(const seg of YS){
    const left=N-seg.from+1, r=seg.r/1200;
    const m=pmt(bal,seg.r,left/12);
    out.push(Math.round(m));
    const n=Math.min(seg.to,N)-seg.from+1;
    if(n>0&&isFinite(n)) for(let i=0;i<n;i++){bal=bal*(1+r)-m}
  }
  return out;
}
let summary=null;
function calc(){
  // all amounts computed in 萬元 (W), money in 元 only for the loan payment
  const priceW=Math.round(parseFloat($('price').value)||0);
  const depositW=10;  // 定金固定 10 萬
  const mode='ceil';
  const rate=parseFloat($('rate').value)||0;
  const rnd=x=>Math[mode](Math.round(x*1e6)/1e6);
  const price=Math.round(priceW*10000);
  $('priceHint').textContent='＝ '+fmt(price)+' 元';

  const R=x=>Math.round(Math.round(x*1e6)/1e6);               // 四捨五入到萬
  const signW=R(priceW*0.10)-depositW;                          // 定金＋簽約金＝總價10%
  const rackW=R(priceW*0.03);                                   // 拆架款 3%
  const licenseW=R(priceW*0.02);                                // 使照掛件 2%
  const taxW=R(priceW*0.05);                                    // 核稅款 5%
  const handoverW=Math.ceil(Math.round(priceW*0.05*1e6)/1e6);  // 交屋款 5% 無條件進位
  const loanW=priceW-depositW-signW-rackW-licenseW-taxW-handoverW; // 貸款＝總價扣除以上
  const loan=Math.round(loanW*10000);

  const msgs=[];
  if(signW<0) msgs.push('總價 10% 小於定金，簽約金變成負數，請確認總價。');
  const st=$('status'); st.hidden=!msgs.length; st.textContent=msgs.join(' ');

  const rows=[
    ['定金','',depositW],
    ['簽約金','',signW],
    ['拆架款','',rackW],
    ['使照掛件','',licenseW],
    ['核稅款','',taxW],
    ['交屋款','',handoverW],
  ];
  const w=x=>(Math.round(x*10000)/10000).toLocaleString('zh-TW',{maximumFractionDigits:4});
  let h='';
  rows.forEach((r,i)=>{const c=i===0?`<td rowspan="2" class="merged">${pct(rows[0][2]+rows[1][2],priceW)}</td>`:i===1?'':`<td>${pct(r[2],priceW)}</td>`;h+=`<tr><td>${r[0]}</td>${c}<td>${w(r[2])}</td></tr>`});
  h+=`<tr class="loan"><td>銀行貸款</td><td>${pct(loanW,priceW)}</td><td>${w(loanW)}</td></tr>`;
  h+=`<tr class="tot"><td>合計</td><td>100%</td><td>${w(priceW)}</td></tr>`;
  rows.forEach(r=>r[2]=Math.round(r[2]*10000));
  $('tbody').innerHTML=h;

  const hand=Math.round(handoverW*10000), own=price-loan-hand;
  $('kOwn').textContent=wan(own);$('kOwnP').textContent=fmt(own)+' 元（'+pct(own,price)+'）';
  $('kHand').textContent=wan(hand);$('kHandP').textContent=fmt(hand)+' 元（'+pct(hand,price)+'）';
  $('kLoan').textContent=wan(loan);$('kLoanP').textContent=fmt(loan)+' 元（'+pct(loan,price)+'）';

  const base=loan+hand;  // 房貸以 銀行貸款＋交屋款 計算
  const terms=[30,40].map(y=>{const m=Math.round(pmt(base,rate,y));const tot=m*y*12;return {y,m,tot,int:tot-base}});
  $('kMonth').textContent=fmt(terms[0].m)+'／'+fmt(terms[1].m);
  $('kMonthS').textContent=`元／月，年利率 ${rate}%`;

  $('cmp').innerHTML=terms.map(t=>`<div class="term">
    <div class="yr">${t.y} 年（${t.y*12} 期）</div>
    <div class="pay">${fmt(t.m)} <small>元／月</small></div>
    <dl><dt>貸款＋交屋款</dt><dd>${fmt(base)}</dd><dt>利息總額（約）</dt><dd>${fmt(t.int)}</dd><dt>本利總繳（約）</dt><dd>${fmt(t.tot)}</dd></dl>
  </div>`).join('');

  const cap=parseInt($('yCap').value)*10000;
  const yPart=Math.min(base,cap), extra=Math.max(0,base-cap);
  const yt={30:youthPays(yPart,30),40:youthPays(yPart,40)};
  const ex={30:Math.round(pmt(extra,rate,30)),40:Math.round(pmt(extra,rate,40))};
  const yn=$('yNote'); yn.hidden=!extra;
  if(extra) yn.textContent=`貸款＋交屋款 ${wan(base)}，超過新青安額度 ${wan(cap)}。超出的 ${wan(extra)} 以一般利率 ${rate}% 計算（30 年每月 ${fmt(ex[30])} 元、40 年每月 ${fmt(ex[40])} 元），下表月付為兩筆合計。`;
  const yTerms=[30,40].map(y=>({y,list:yt[y].map(v=>v+ex[y])}));
  $('ybody').innerHTML=YS.map((seg,i)=>`<tr><td>${seg.label}</td><td>${seg.r}%</td><td>${fmt(yTerms[0].list[i])}</td><td>${fmt(yTerms[1].list[i])}</td></tr>`).join('');
  $('kYouth').textContent=fmt(yTerms[0].list[0])+'／'+fmt(yTerms[1].list[0]);
  $('kYouthS').textContent='元／月，前 3 年 1.775%';
  summary={price,rows,loan,own,hand,base,rate,terms,yPart,extra,yTerms};
}

$('copyBtn').onclick=async()=>{
  const s=summary;if(!s)return;
  let t=`房屋總價：${wan(s.price)}元\n`;
  s.rows.forEach(r=>t+=`${r[0]}：${wan(r[2])}元\n`);
  t+=`銀行貸款（${pct(s.loan,s.price)}）：${wan(s.loan)}元\n自備款（${pct(s.own,s.price)}）：${wan(s.own)}元\n交屋款（${pct(s.hand,s.price)}）：${wan(s.hand)}元\n`;
  t+=`房貸試算金額（貸款＋交屋款）：${wan(s.base)}元\n房貸年利率 ${s.rate}%，本息平均攤還\n`;
  s.terms.forEach(x=>t+=`${x.y} 年：每月約 ${fmt(x.m)} 元\n`);
  t+=`新青安 3.0（額度 ${wan(s.yPart)}${s.extra?`，超出 ${wan(s.extra)} 以 ${s.rate}% 計入`:''}）\n`;
  YS.forEach((seg,i)=>t+=`${seg.label}（${seg.r}%）：30 年每月約 ${fmt(s.yTerms[0].list[i])} 元／40 年每月約 ${fmt(s.yTerms[1].list[i])} 元\n`);
  t+='※試算僅供參考，實際以契約及銀行核貸為準';
  const btn=$('copyBtn');
  try{await navigator.clipboard.writeText(t);btn.textContent='已複製';}
  catch(e){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');btn.textContent='已複製';}catch(_){btn.textContent='請手動複製';}ta.remove();}
  setTimeout(()=>btn.textContent='複製付款明細',1800);
};

['price','rate','yCap'].forEach(id=>$(id).addEventListener('input',calc));
calc();
</script>

<script>
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}
</script>
</body>
</html>
